services:
  postgres:
    image: postgres:16-alpine
    container_name: saludprolab-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: saludprolab
      POSTGRES_PASSWORD: saludprolab123
      POSTGRES_DB: saludprolab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: saludprolab-s3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
